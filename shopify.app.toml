# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "64f9f444c1d869eaf16ce88f4028e407"
name = "Lemmary"
application_url = "http://localhost:3001/auth/shopify/install"
embedded = false

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request" ]
uri = "https://api.lemmary.com/webhooks/shopify/customers/data-request"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/redact" ]
uri = "https://api.lemmary.com/webhooks/shopify/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = [ "shop/redact" ]
uri = "https://api.lemmary.com/webhooks/shopify/shop/redact"

[[webhooks.subscriptions]]
topics = [ "app_subscriptions/update" ]
uri = "https://api.lemmary.com/webhooks/shopify/app-subscriptions/update"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "https://api.lemmary.com/webhooks/shopify/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_orders,read_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "http://localhost:3001/auth/shopify/callback",
  "https://api.lemmary.com/auth/shopify/callback"
]
